name: insomea-dev
services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: insomea-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: insomea_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: my_secure_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./InsomeaTech_Dev_Backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d insomea_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insomea-network
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  # 2. Express Backend API
  backend:
    build:
      context: ./InsomeaTech_Dev_Backend
      dockerfile: Dockerfile
    container_name: insomea-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./InsomeaTech_Dev_Backend/.env
    environment:
      DB_HOST: postgres
      DB_USER: dev_user
      DB_PASSWORD: my_secure_password
      DB_NAME: insomea_db
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insomea-network
  # 3. Angular Frontend
  frontend:
    build:
      context: ./InsomeaTech_Dev_Frontend
      dockerfile: Dockerfile
    container_name: insomea-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - insomea-network

volumes:
  postgres_data:
    driver: local

networks:
  insomea-network:
    driver: bridge
